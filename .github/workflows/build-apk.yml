name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html manifest.json icon.svg icon-192.png icon-512.png www/

      - name: Install Capacitor and the barcode library
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/android @capacitor/cli @zxing/library@0.21.3
          cp node_modules/@zxing/library/umd/index.min.js www/zxing.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js#zxing.min.js#' www/index.html
          grep -q 'src="zxing.min.js"' www/index.html

      - name: Capacitor config
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.mlarby.prix",
            "appName": "ماسح الأسعار",
            "webDir": "www",
            "server": { "androidScheme": "https" }
          }
          EOF

      - name: Add Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Declare camera permission
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.CAMERA' "$MANIFEST" || sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n    <application#' "$MANIFEST"
          grep -n 'CAMERA' "$MANIFEST"

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Check APK exists
        run: test -f android/app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: masah-al-asaar-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
